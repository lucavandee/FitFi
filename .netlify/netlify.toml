functionsDirectory = "/Users/luc/Desktop/FitFi-clone/netlify/functions"
functionsDirectoryOrigin = "config-v1"
redirectsOrigin = "config"
plugins = []

[build]
publish = "/Users/luc/Desktop/FitFi-clone/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npx vite build"
functions = "/Users/luc/Desktop/FitFi-clone/netlify/functions"

[build.environment]
NODE_VERSION = "20"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]
node_bundler = "esbuild"

[[headers]]
for = "/*"

[headers.values]
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "SAMEORIGIN"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
Cross-Origin-Opener-Policy = "same-origin"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://analytics.google.com https://region1.analytics.google.com https://region1.google-analytics.com https://www.googletagmanager.com https://images.pexels.com https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.shopify.com https://*.shopify.com https://glp8.net https://*.daisycon.com https://daisycon.io; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.js"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/*.css"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/icons/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/images/*"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/hero/*"

[headers.values]
Cache-Control = "public, max-age=604800"

[[headers]]
for = "/data/*"

[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/xml"

[[headers]]
for = "/robots.txt"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/manifest.json"

[headers.values]
Cache-Control = "public, max-age=86400"
Content-Type = "application/manifest+json"

