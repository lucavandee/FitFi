[build]
publish = "dist"
functions = "netlify/functions"
# `npm run build` = `tsc --noEmit && vite build`. Stond hier eerder als
# `npx vite build`, dus zonder typecheck, terwijl de site-instelling in het
# Netlify-dashboard wel `npm run build` draaide. Die twee spraken elkaar tegen
# en het dashboard won. Nu staat de poort in versiebeheer, waar hij hoort:
# wie het buildcommando leest, ziet meteen dat de typecheck erbij hoort.
command = "npm run build"

[build.environment]
NODE_VERSION = "20"

[functions]
node_bundler = "esbuild"

[[redirects]]
from = "/login"
to = "/inloggen"
status = 301
force = true

[[redirects]]
from = "/register"
to = "/registreren"
status = 301
force = true

[[redirects]]
from = "/quiz"
to = "/onboarding"
status = 301
force = true

[[redirects]]
from = "/stijlquiz"
to = "/onboarding"
status = 301
force = true

[[redirects]]
from = "/faq"
to = "/veelgestelde-vragen"
status = 301
force = true

[[redirects]]
from = "/terms"
to = "/algemene-voorwaarden"
status = 301
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200