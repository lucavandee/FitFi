<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- Lettertypen: Instrument Serif en Plus Jakarta Sans staan zelf gehost in
         public/fonts/, met @font-face in src/index.css. Geen verzoek naar Google.
         De twee die de herokop boven de vouw nodig heeft, worden vooraf geladen:
         zonder preload kwamen ze op Slow 4G pas na de H1 en sprong de kop 49 px
         (CLS, gemeten op 8 oktober). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/plus-jakarta-sans-latin.cd8db90c.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-serif-italic-latin.6ee678c3.woff2" />
    <!-- De tweede regel van de homepagekop staat recht ("bij je past."). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/instrument-serif-latin.60c06664.woff2" />

    <!-- ✅ Favicon and meta -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Geen beeld-preload meer: sinds de homepage van 21 oktober 2026
         (designsysteem v2) is de kop het grootste element boven de vouw, geen
         foto. De preload van het oude hero-beeld (207 KB) at op Slow 4G bijna
         een seconde bandbreedte voor een beeld dat niet meer op de pagina stond. -->
    <meta name="theme-color" content="#A85740" />

    <!-- SEO defaults.
         Deze tags gelden voor elke bezoeker die GEEN JavaScript uitvoert:
         social scrapers (WhatsApp, LinkedIn, Slack) en crawlers die niet
         renderen. De Seo-component overschrijft ze client-side per route.
         Er stond hier eerder een harde canonical naar https://fitfi.ai/,
         waardoor elke subpagina naar de homepage canonicaliseerde en die
         canonical bovendien naar een 301 wees. Die is nu weg: zonder tag
         bepaalt Google de URL zelf, wat beter is dan een foute tag.
         Titel, beschrijving en beeld zijn die van de homepage en staan ook in
         src/content/landingHead.ts; landingHead.test.ts houdt ze gelijk. Het
         beeld draagt het AI-label in het beeld zelf. -->
    <meta property="og:site_name" content="FitFi" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="FitFi: stijladvies op basis van wat je graag draagt" />
    <meta property="og:description" content="Beantwoord vragen over kleur, pasvorm en gelegenheden en kies uit beelden van outfits. Met een gratis account krijg je een kleurpalet en outfits met links naar winkels." />
    <meta property="og:image" content="https://www.fitfi.ai/og/og-home_1200x630.7c31a04e.jpg" />
    <meta property="og:url" content="https://www.fitfi.ai/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitFi: stijladvies op basis van wat je graag draagt" />
    <meta name="twitter:description" content="Beantwoord vragen over kleur, pasvorm en gelegenheden en kies uit beelden van outfits. Met een gratis account krijg je een kleurpalet en outfits met links naar winkels." />
    <meta name="twitter:image" content="https://www.fitfi.ai/og/og-home_1200x630.7c31a04e.jpg" />
    <meta name="description" content="Beantwoord vragen over kleur, pasvorm en gelegenheden en kies uit beelden van outfits. Met een gratis account krijg je een kleurpalet en outfits met links naar winkels." />

    <title>FitFi: stijladvies op basis van wat je graag draagt</title>

    <!-- Daisycon verification -->
    <meta name="ee766b42deed7db" content="4a91cb66c90ac80df32bb7517a55886a" />

    <!-- Google Analytics staat hier bewust niet. gtag.js laadt pas na
         toestemming voor analytics, vanuit src/utils/analytics.ts. Hier stond
         het vroeger met consent mode op denied, en dan ging er voor elke keuze
         toch een page_view naar Google. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
