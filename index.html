<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- ✅ Performance optimizations -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.pexels.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- Prefetch common routes -->
    <link rel="prefetch" href="/results" as="document">
    <link rel="prefetch" href="/prijzen" as="document">

    <!-- ✅ Fonts: Instrument Serif (editorial headlines) + Plus Jakarta Sans (premium body) -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- ✅ Favicon and meta -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- LCP: het hero-beeld staat in een lazy geladen pagina, dus de preload-scanner
         ontdekt het normaal pas na index-chunk, vendors, pagina-chunk en render.
         Deze twee regels spiegelen exact de <picture> in LandingPage: onder 1024px
         het hero/-beeld, daarboven het images/-beeld. Zo haalt de browser er precies
         een op. Ze staan bewust NA de viewport-meta, anders rekent een mobiele
         browser de media-query tegen de standaard 980px en kan hij het verkeerde
         bestand kiezen. -->
    <link rel="preload" as="image" media="(max-width: 1023px)" fetchpriority="high"
          href="/hero/hf_20260221_211319_a32928c5-35c0-46c6-be6e-cfa9d8747078.webp" />
    <link rel="preload" as="image" media="(min-width: 1024px)" fetchpriority="high"
          href="/images/hf_20260221_210750_e12efd50-544c-4e35-986d-bfff9999542b.webp" />
    <meta name="theme-color" content="#A6886A" />

    <!-- SEO defaults.
         Deze tags gelden voor elke bezoeker die GEEN JavaScript uitvoert:
         social scrapers (WhatsApp, LinkedIn, Slack) en crawlers die niet
         renderen. De Seo-component overschrijft ze client-side per route.
         Er stond hier eerder een harde canonical naar https://fitfi.ai/,
         waardoor elke subpagina naar de homepage canonicaliseerde en die
         canonical bovendien naar een 301 wees. Die is nu weg: zonder tag
         bepaalt Google de URL zelf, wat beter is dan een foute tag. -->
    <meta property="og:site_name" content="FitFi" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="FitFi — Persoonlijk stijladvies" />
    <meta property="og:description" content="Beantwoord een paar vragen en zie welke outfits bij je passen. Met uitleg en directe shoplinks." />
    <meta property="og:image" content="https://www.fitfi.ai/og/og-default.jpg" />
    <meta property="og:url" content="https://www.fitfi.ai/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitFi — Persoonlijk stijladvies" />
    <meta name="twitter:description" content="Beantwoord een paar vragen en zie welke outfits bij je passen. Met uitleg en directe shoplinks." />
    <meta name="twitter:image" content="https://www.fitfi.ai/og/og-default.jpg" />
    <meta name="description" content="Beantwoord een paar vragen en zie welke outfits bij je passen. Met uitleg en directe shoplinks." />

    <title>FitFi — Persoonlijk stijladvies</title>

    <!-- Daisycon verification -->
    <meta name="ee766b42deed7db" content="4a91cb66c90ac80df32bb7517a55886a" />

    <!-- Google tag (gtag.js) — consent mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'wait_for_update': 500
      });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D1PPLR2L3R"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-D1PPLR2L3R');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
